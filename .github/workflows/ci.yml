name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Test
        run: pytest
      - name: Smoke-run evidence scripts
        run: |
          python scripts/llm_judge_sim.py --smoke
          python scripts/offline_online_sim.py --smoke
          python scripts/ppi_covariates_sim.py --smoke
          python scripts/judge_drift_sim.py --smoke
          python scripts/silent_drift_sim.py --smoke
